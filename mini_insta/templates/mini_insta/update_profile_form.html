<!-- Official HTML form to handle updates to an exitsing profile -->
 {% extends 'mini_insta/base.html' %}

 {% block content %}
 <h1> Update this Profile: </h1>

 <form action="{% url 'update_profile'%}" method="POST" 
enctype="multipart/form-data">

    {% csrf_token %}    
    <table>
        {{form.as_table}}
    </table>
    <br>
    <input type="submit" name="submit" value="Update">
</form>

<!-- Form if you would like to cancel updates -->
 <form action="{% url 'show_my_profile' %}" method="GET">
    <input type="submit" name="Cancel" value="Cancel updates">
 </form>
 

 {% endblock %}
