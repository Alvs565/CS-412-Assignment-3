{% extends "mini_insta/base.html" %}
<!-- Form to handle deletion of a post -->
{% block content %}
<h3> Are you sure you want to delete this post? </h3>
<p>
    {{post}}
</p>

<form method="POST">
    {% csrf_token %}
    <input type="submit" value="Delete">
</form>

<!-- Form to Cancel Deletion-->
 <form action="{% url 'profile' object.profile.pk %}" method="GET">
    {% csrf_token %}
    <input type="submit" value="Cancel">
 </form>


{% endblock %}
