{% extends 'blog/base.html' %}

{% block content %}
<h1> Create a New Article: </h1>

<form action="{% url 'create_article' %}" method="POST"
    enctype="multipart/form-data"> 
    
    {% csrf_token %}
    <table>
    {{form.as_table}}
    </table>
    <br>
    <input type="submit" name="submit" value="Submit">

</form>


{% endblock %}
